openapi: 3.1.0
info:
  title: golang-api-template
  description: |
    Opinionated production-ready Go API template.

    Architecture invariants:
    - Gin is an implementation detail behind `internal/api/ginadapter`.
    - Observability (logs, metrics, traces, health) is provided natively by
      [hellnet-lib-telemetry](https://github.com/guilhermelinosp/hellnet-lib-telemetry).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: platform
    description: Service discovery and Kubernetes probes (provided by the template)
  - name: observability
    description: Health/reporting endpoints backed by hellnet-lib-telemetry
  - name: hello
    description: Reference business module (/api/v1)

paths:
  /:
    get:
      tags: [platform]
      summary: Service discovery payload
      operationId: getRoot
      responses:
        "200":
          description: Build metadata
          content:
            application/json:
              schema:
                type: object
                required: [service, version]
                properties:
                  service: { type: string }
                  version: { type: string }
                  commit: { type: string }
                  builtAt: { type: string }
                  go: { type: string }
                  docs: { type: string }

  /live:
    get:
      tags: [observability]
      summary: Liveness probe (self-check)
      description: Implemented by hellnet-lib-telemetry `Live()`. Map k8s livenessProbe here.
      operationId: getLive
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: { type: object }

  /ready:
    get:
      tags: [observability]
      summary: Readiness probe (self + custom checks + collector reachability)
      description: >
        Implemented by hellnet-lib-telemetry `Ready()`. Register dependency
        checks via `tel.HealthRegister("postgres", ...)` — they run here
        automatically. Map k8s readinessProbe here.
      operationId: getReady
      responses:
        "200":
          description: Ready to receive traffic
          content:
            application/json:
              schema: { type: object }
        "503":
          description: Not ready (one or more checks failing)
          content:
            application/json:
              schema: { type: object }

  /health:
    get:
      tags: [observability]
      summary: Combined health report
      description: Implemented by hellnet-lib-telemetry `Health()`.
      operationId: getHealth
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { type: object }
        "503":
          description: Degraded or not ready
          content:
            application/json:
              schema: { type: object }

components:
  schemas:
    GreetInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
    Greeting:
      type: object
      required: [message]
      properties:
        message: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_ERROR }
            message: { type: string }
        requestId: { type: string, description: Echoed X-Request-ID when present }
  responses:
    Error:
      description: Platform error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

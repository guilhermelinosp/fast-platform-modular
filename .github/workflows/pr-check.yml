name: pr-check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    uses: guilhermelinosp/templates/.github/workflows/shellcheck.yml@88029054697662ad9b664cb5d47e5547a8d0c4a5

  merge-check:
    uses: guilhermelinosp/templates/.github/workflows/merge-check.yml@88029054697662ad9b664cb5d47e5547a8d0c4a5

  gitleaks:
    uses: guilhermelinosp/templates/.github/workflows/gitleaks.yml@88029054697662ad9b664cb5d47e5547a8d0c4a5

  labeler:
    uses: guilhermelinosp/templates/.github/workflows/labeler.yml@88029054697662ad9b664cb5d47e5547a8d0c4a5

  go-quality:
    uses: guilhermelinosp/templates/.github/workflows/go-quality.yml@941d2ee753db423972617a55dfd98f230b2736f9
    with:
      go-version-file: go.mod

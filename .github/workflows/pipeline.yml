name: pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
  workflow_dispatch:

jobs:
  release:
    name: release
    permissions:
      contents: write
    uses: guilhermelinosp/templates/.github/workflows/release.yml@fde7d4a5a2e7aa5dd42e8812df4783daa39b1543 # main

  quality:
    name: quality
    needs: [release]
    permissions:
      contents: read
      pull-requests: write
    uses: guilhermelinosp/templates/.github/workflows/lib-quality.yml@fde7d4a5a2e7aa5dd42e8812df4783daa39b1543 # main
    with:
      go-version-file: go.mod
